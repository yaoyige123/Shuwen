name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # sounddevice / soundfile 在 Linux 上需要这些系统库
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app scripts tests

      - name: Type check
        run: mypy app

      - name: Tests
        env:
          # 只用于让 ChatOpenAI 在 import 期能构造，不会真的发请求
          OPENAI_API_KEY: dummy-key-for-ci
          OPENAI_API_BASE: http://127.0.0.1:9/v1
          TASK_BACKEND: memory
          EXECUTION_MODE: inline
          CHECKPOINT_BACKEND: memory
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
