<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMeKG · 麻醉术前访视助手</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --user-bg: #2563eb;
    --assistant-bg: #ffffff;
    --warn: #b45309;
    --err: #b91c1c;
    --ok: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  .badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: #eef2f7;
    color: var(--muted);
    white-space: nowrap;
  }
  .badge.running { background: #e0edff; color: var(--accent); }
  .badge.ok { background: #e7f6ec; color: var(--ok); }
  .badge.error { background: #fdecec; color: var(--err); }
  .badge.warn { background: #fef3e2; color: var(--warn); }
  .session { font-size: 12px; color: var(--muted); }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 6px 12px;
  }
  button:hover { border-color: #c7cdd6; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    padding: 10px 20px;
    font-weight: 600;
  }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 78%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant, .msg.system { align-self: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid var(--line);
  }
  .msg.user .bubble {
    background: var(--user-bg);
    color: #fff;
    border-color: var(--user-bg);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble { background: var(--assistant-bg); border-bottom-left-radius: 4px; }
  .msg.system .bubble {
    background: #fff7ed;
    border-color: #fed7aa;
    color: #7c2d12;
    font-size: 13px;
  }
  .meta-line { font-size: 11px; color: var(--muted); padding: 0 4px; }
  .msg .play {
    align-self: flex-start;
    font-size: 12px;
    padding: 2px 8px;
    color: var(--muted);
    background: transparent;
  }
  .msg .play:hover { color: var(--accent); border-color: #c7cdd6; }
  form {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 20px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    font: inherit;
    resize: none;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    outline: none;
    max-height: 140px;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #dbeafe; }
  .hint {
    font-size: 11px;
    color: var(--muted);
    padding: 0 20px 10px;
    background: var(--panel);
  }
  .typing { display: inline-flex; gap: 3px; align-items: center; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: #9ca3af; animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }
</style>
</head>
<body>
<header>
  <h1>CMeKG 麻醉术前访视助手</h1>
  <span id="status" class="badge">就绪</span>
  <span class="spacer"></span>
  <span class="session" id="session-label"></span>
  <button id="voice-toggle" type="button">🔇 语音：关</button>
  <button id="new-session" type="button">新会话</button>
</header>

<main id="messages"></main>

<form id="composer">
  <textarea id="input" rows="2" placeholder="例如：你好，我姓张，要做胆囊切除手术"></textarea>
  <button id="send" class="primary" type="submit">发送</button>
</form>
<div class="hint">Enter 发送 · Shift+Enter 换行 · 对话状态通过 SSE 实时推送</div>

<script>
(function () {
  "use strict";

  var TERMINAL = ["succeeded", "failed", "timeout", "cancelled"];
  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var statusEl = document.getElementById("status");
  var sessionLabel = document.getElementById("session-label");
  var newBtn = document.getElementById("new-session");
  var voiceBtn = document.getElementById("voice-toggle");

  var busy = false;
  var voiceOn = localStorage.getItem("cmekg-voice") === "1";
  var ttsBroken = false;
  // 后端没有讯飞凭据时，降级到浏览器内置语音（Web Speech API）
  var browserTts = false;
  var browserTtsNoticeShown = false;

  function renderVoice() {
    voiceBtn.textContent = voiceOn ? "🔊 语音：开" : "🔇 语音：关";
  }

  var currentAudio = null;

  function stopSpeech() {
    // 新语音进来时，先掐掉上一条，避免两个声音叠在一起
    if (currentAudio) {
      try { currentAudio.pause(); } catch (e) { /* ignore */ }
      try { currentAudio.src = ""; } catch (e) { /* ignore */ }
      currentAudio = null;
    }
    if ("speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    }
  }

  function speakWithBrowser(text) {
    if (!("speechSynthesis" in window)) { return false; }
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 1.0;
      var zh = (window.speechSynthesis.getVoices() || []).filter(function (v) {
        return /^zh/i.test(v.lang || "");
      });
      if (zh.length) { u.voice = zh[0]; }
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function playVoice(text) {
    if (!text) { return; }

    // 关键：先停掉正在播的那条
    stopSpeech();

    if (browserTts) {
      if (speakWithBrowser(text)) { setStatus("ok", "浏览器语音"); }
      else { append("system", "浏览器内置语音播放失败。"); }
      return;
    }

    if (ttsBroken) {
      append("system", "语音服务不可用。");
      return;
    }

    setStatus("running", "合成语音…");
    try {
      var resp = await fetch("/api/v1/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });

      if (resp.status === 503) {
        // 后端未配置讯飞凭据 —— 用浏览器语音兜底，不影响对话
        if (speakWithBrowser(text)) {
          browserTts = true;
          if (!browserTtsNoticeShown) {
            browserTtsNoticeShown = true;
            append("system", "未配置讯飞语音凭据，已自动改用浏览器内置语音朗读。想换成讯飞音色，在 .env 填 XUNFEI_APP_ID / XUNFEI_API_KEY / XUNFEI_API_SECRET 后重启即可。");
          }
          setStatus("ok", "浏览器语音");
          return;
        }
        ttsBroken = true;
        voiceOn = false;
        localStorage.setItem("cmekg-voice", "0");
        renderVoice();
        setStatus("warn", "语音不可用");
        append("system", "当前浏览器不支持内置语音，且后端未配置讯飞凭据。文本对话不受影响。");
        return;
      }

      if (!resp.ok) {
        setStatus("warn", "合成失败");
        append("system", "语音合成失败：HTTP " + resp.status);
        return;
      }

      var blob = await resp.blob();
      var url = URL.createObjectURL(blob);
      var audio = new Audio(url);
      currentAudio = audio;
      audio.onended = function () {
        URL.revokeObjectURL(url);
        if (currentAudio === audio) { currentAudio = null; }
      };
      await audio.play();
      setStatus("ok", "完成");
    } catch (err) {
      setStatus("warn", "播放失败");
      append("system", "语音播放失败：" + err);
    }
  }

  function newSessionId() {
    var id = "web-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("cmekg-session", id);
    return id;
  }

  function sessionId() {
    return localStorage.getItem("cmekg-session") || newSessionId();
  }

  function setStatus(kind, text) {
    statusEl.className = "badge" + (kind ? " " + kind : "");
    statusEl.textContent = text;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function append(role, text, meta) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + role;

    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (meta) {
      var m = document.createElement("div");
      m.className = "meta-line";
      m.textContent = meta;
      wrap.appendChild(m);
    }

    if (role === "assistant") {
      var play = document.createElement("button");
      play.type = "button";
      play.className = "play";
      play.textContent = "🔊 朗读";
      play.addEventListener("click", function () { playVoice(text); });
      wrap.appendChild(play);
    }

    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function appendTyping() {
    var wrap = document.createElement("div");
    wrap.className = "msg assistant";
    wrap.id = "typing";
    wrap.innerHTML = '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function removeTyping() {
    var el = document.getElementById("typing");
    if (el) { el.remove(); }
  }

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
    inputEl.disabled = value;
  }

  function finish(task) {
    removeTyping();
    if (task.status === "succeeded") {
      var result = task.result || {};
      append("assistant", result.reply || "(模型没有返回内容)", "attempts=" + (result.attempts || 1) + " · state=" + (result.dialog_state || "-"));
      setStatus("ok", "完成");
      if (voiceOn && result.reply) { playVoice(result.reply); }
    } else {
      append("system", "任务结束：" + task.status + (task.error ? "\n" + task.error : ""));
      setStatus("error", task.status);
    }
    setBusy(false);
    inputEl.focus();
  }

  function pollFallback(taskId) {
    var tries = 0;
    var timer = setInterval(async function () {
      tries += 1;
      if (tries > 120) { clearInterval(timer); removeTyping(); setBusy(false); setStatus("error", "轮询超时"); return; }
      try {
        var resp = await fetch("/api/v1/tasks/" + taskId);
        if (!resp.ok) { return; }
        var task = await resp.json();
        if (TERMINAL.indexOf(task.status) !== -1) {
          clearInterval(timer);
          finish(task);
        } else if (task.status === "running") {
          setStatus("running", "思考中…");
        }
      } catch (e) { /* 网络抖动，继续重试 */ }
    }, 1200);
  }

  function watch(taskId) {
    appendTyping();
    setStatus("running", "思考中…");

    var settled = false;
    var es;

    try {
      es = new EventSource("/api/v1/tasks/" + taskId + "/events");
    } catch (e) {
      pollFallback(taskId);
      return;
    }

    es.addEventListener("status", function (ev) {
      var task;
      try { task = JSON.parse(ev.data); } catch (e) { return; }
      if (TERMINAL.indexOf(task.status) !== -1) {
        settled = true;
        es.close();
        finish(task);
      } else if (task.status === "running") {
        setStatus("running", "思考中…");
      } else if (task.status === "queued") {
        setStatus("running", "排队中…");
      }
    });

    es.addEventListener("done", function () { es.close(); });

    es.onerror = function () {
      if (settled) { return; }
      es.close();
      setStatus("warn", "连接中断，改用轮询");
      pollFallback(taskId);
    };
  }

  async function submit(text, hidden) {
    if (!hidden) { append("user", text); }
    stopSpeech();  // 用户开口就别再念上一条了
    setBusy(true);
    setStatus("running", "提交中…");

    var headers = { "Content-Type": "application/json" };
    headers["Idempotency-Key"] = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : "k-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);

    var resp;
    try {
      resp = await fetch("/api/v1/sessions/" + encodeURIComponent(sessionId()) + "/messages", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ message: text })
      });
    } catch (err) {
      setBusy(false);
      setStatus("error", "网络错误");
      append("system", "无法连接后端：" + err);
      return;
    }

    if (resp.status === 401) {
      setBusy(false);
      setStatus("error", "401");
      append("system", "后端启用了 API_KEY 鉴权，浏览器页面无法携带 X-API-Key。请在 .env 中清空 API_KEY，或改用接口调用。");
      return;
    }

    if (resp.status === 429) {
      var retryAfter = resp.headers.get("Retry-After") || "60";
      setBusy(false);
      setStatus("warn", "限流");
      append("system", "请求过于频繁，请 " + retryAfter + " 秒后重试。");
      return;
    }

    if (resp.status !== 202) {
      var body = await resp.text();
      setBusy(false);
      setStatus("error", String(resp.status));
      append("system", "提交失败（HTTP " + resp.status + "）：" + body);
      return;
    }

    var payload = await resp.json();
    watch(payload.task_id);
  }

  // 新会话由助手先开口：前端发一条"隐藏"的引导消息，不渲染成用户气泡
  var BOOTSTRAP_MESSAGE = "开始术前访视";

  function startedKey(sid) {
    return "cmekg-started:" + sid;
  }

  function startSession() {
    var sid = sessionId();
    if (localStorage.getItem(startedKey(sid)) === "1") { return; }
    localStorage.setItem(startedKey(sid), "1");
    submit(BOOTSTRAP_MESSAGE, true);
  }

  document.getElementById("composer").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (busy) { return; }
    var text = inputEl.value.trim();
    if (!text) { return; }
    inputEl.value = "";
    submit(text);
  });

  inputEl.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      document.getElementById("composer").requestSubmit();
    }
  });

  newBtn.addEventListener("click", function () {
    if (busy) { return; }
    newSessionId();
    messagesEl.innerHTML = "";
    renderSession();
    setStatus("", "就绪");
    startSession();
  });

  voiceBtn.addEventListener("click", function () {
    voiceOn = !voiceOn;
    if (voiceOn) { ttsBroken = false; }
    localStorage.setItem("cmekg-voice", voiceOn ? "1" : "0");
    renderVoice();
  });

  function renderSession() {
    sessionLabel.textContent = "session: " + sessionId();
  }

  renderSession();
  renderVoice();
  startSession();
})();
</script>
</body>
</html>
