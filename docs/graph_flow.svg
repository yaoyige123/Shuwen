<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20639b"/>
    </marker>

    <pattern id="yellowHatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#fffdf4"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#f2c94c" stroke-width="3" opacity="0.45"/>
    </pattern>
    <pattern id="blueHatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f7fbff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#56b4e9" stroke-width="3" opacity="0.45"/>
    </pattern>
    <pattern id="greenHatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f8fff8"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#6fcf97" stroke-width="3" opacity="0.45"/>
    </pattern>
    <pattern id="redHatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#fff8f8"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#eb5757" stroke-width="3" opacity="0.45"/>
    </pattern>
    <pattern id="grayHatch" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#fbfbfb"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bdbdbd" stroke-width="3" opacity="0.35"/>
    </pattern>

    <style>
      .title { font-family: "Comic Sans MS", "Segoe Print", cursive; font-size: 36px; font-weight: 700; fill: #222; }
      .subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; fill: #555; }
      .label { font-family: "Comic Sans MS", "Segoe Print", cursive; font-size: 23px; fill: #222; }
      .small { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; fill: #333; }
      .tiny { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #444; }
      .box { stroke: #222; stroke-width: 3; rx: 4; ry: 4; }
      .thinBox { stroke: #222; stroke-width: 2.4; rx: 4; ry: 4; }
      .route { fill: #fff; stroke: #222; stroke-width: 3; }
      .line { stroke: #222; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thinLine { stroke: #222; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #20639b; stroke-width: 2.8; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrowBlue); }
      .return { stroke: #222; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .note { fill: #fffdf4; stroke: #8c7b30; stroke-width: 2; rx: 6; ry: 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1300" fill="#ffffff"/>

  <text x="900" y="42" text-anchor="middle" class="title">CMeKG-Agent LangGraph Flow</text>
  <text x="900" y="72" text-anchor="middle" class="subtitle">Actual runtime flow from Graph/graph.py, with web/app.py entry state initialization</text>

  <!-- State memory panel -->
  <rect x="60" y="110" width="360" height="570" fill="url(#yellowHatch)" class="box"/>
  <text x="240" y="155" text-anchor="middle" class="title" font-size="32">MedicalState</text>

  <rect x="105" y="190" width="270" height="52" fill="#fff" class="thinBox"/>
  <text x="240" y="224" text-anchor="middle" class="label">messages</text>

  <rect x="105" y="260" width="270" height="52" fill="#fff" class="thinBox"/>
  <text x="240" y="294" text-anchor="middle" class="label">user_information</text>

  <rect x="105" y="330" width="270" height="52" fill="#fff" class="thinBox"/>
  <text x="240" y="364" text-anchor="middle" class="label">medical_history</text>

  <rect x="105" y="400" width="270" height="52" fill="#fff" class="thinBox"/>
  <text x="240" y="434" text-anchor="middle" class="label">medicine_taking</text>

  <rect x="105" y="470" width="270" height="52" fill="#fff" class="thinBox"/>
  <text x="240" y="504" text-anchor="middle" class="label">dialog_state stack</text>

  <rect x="105" y="540" width="270" height="52" fill="#fff" class="thinBox"/>
  <text x="240" y="574" text-anchor="middle" class="label">current_step</text>

  <rect x="105" y="610" width="270" height="44" fill="#fff" class="thinBox"/>
  <text x="240" y="638" text-anchor="middle" class="small">graph_qa_result / session_id</text>

  <!-- Top entry flow -->
  <rect x="760" y="110" width="280" height="64" fill="url(#blueHatch)" class="box"/>
  <text x="900" y="150" text-anchor="middle" class="label">User Input</text>

  <path d="M 900 174 L 900 215" class="line"/>
  <rect x="725" y="215" width="350" height="68" fill="url(#blueHatch)" class="box"/>
  <text x="900" y="242" text-anchor="middle" class="label">send_message()</text>
  <text x="900" y="266" text-anchor="middle" class="tiny">first msg: update_state(dialog_state=verify_information)</text>

  <path d="M 900 283 L 900 325" class="line"/>
  <rect x="745" y="325" width="310" height="64" fill="url(#blueHatch)" class="box"/>
  <text x="900" y="365" text-anchor="middle" class="label">graph.stream(...)</text>

  <path d="M 900 389 L 900 430" class="line"/>
  <rect x="800" y="430" width="200" height="58" fill="url(#grayHatch)" class="thinBox"/>
  <text x="900" y="466" text-anchor="middle" class="label">START</text>

  <path d="M 900 488 L 900 530" class="line"/>
  <rect x="750" y="530" width="300" height="64" fill="url(#blueHatch)" class="box"/>
  <text x="900" y="569" text-anchor="middle" class="label">initialize</text>

  <path d="M 900 594 L 900 642" class="line"/>
  <polygon points="900,642 1060,752 900,862 740,752" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <text x="900" y="738" text-anchor="middle" class="label">route_to</text>
  <text x="900" y="768" text-anchor="middle" class="label">_workflow</text>
  <text x="900" y="795" text-anchor="middle" class="tiny">uses dialog_state[-1]</text>

  <!-- Primary assistant branch -->
  <path d="M 900 862 L 900 910" class="line"/>
  <rect x="750" y="910" width="300" height="66" fill="url(#blueHatch)" class="box"/>
  <text x="900" y="950" text-anchor="middle" class="label">primary_assistant</text>
  <text x="900" y="970" text-anchor="middle" class="tiny">Sequence_Primary_Assistant</text>

  <path d="M 900 976 L 900 1025" class="line"/>
  <polygon points="900,1025 1040,1115 900,1205 760,1115" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <text x="900" y="1105" text-anchor="middle" class="label">route_primary</text>
  <text x="900" y="1134" text-anchor="middle" class="label">_assistant</text>

  <!-- Current delegated agent branches from route_to_workflow -->
  <path d="M 740 752 C 600 735 535 705 460 660" class="thinLine"/>
  <text x="540" y="720" class="tiny">dialog_state=verify_information</text>
  <rect x="300" y="630" width="320" height="64" fill="url(#greenHatch)" class="box"/>
  <text x="460" y="669" text-anchor="middle" class="label">Information_Agent</text>

  <path d="M 800 828 C 700 870 640 895 560 930" class="thinLine"/>
  <text x="592" y="860" class="tiny">dialog_state=history_taking</text>
  <rect x="400" y="930" width="320" height="64" fill="url(#greenHatch)" class="box"/>
  <text x="560" y="969" text-anchor="middle" class="label">History_Agent</text>

  <path d="M 1000 828 C 1110 870 1160 895 1240 930" class="thinLine"/>
  <text x="1090" y="860" class="tiny">dialog_state=risk_assessment</text>
  <rect x="1080" y="930" width="320" height="64" fill="url(#redHatch)" class="box"/>
  <text x="1240" y="969" text-anchor="middle" class="label">Risk_Agent</text>

  <path d="M 1060 752 C 1215 735 1305 705 1390 660" class="thinLine"/>
  <text x="1195" y="720" class="tiny">dialog_state=analgesia</text>
  <rect x="1230" y="630" width="320" height="64" fill="url(#greenHatch)" class="box"/>
  <text x="1390" y="669" text-anchor="middle" class="label">Analgesia_Agent</text>

  <!-- Entry nodes routed by primary assistant -->
  <path d="M 760 1115 C 665 1110 605 1070 560 994" class="dash"/>
  <rect x="390" y="1035" width="340" height="48" fill="url(#blueHatch)" class="thinBox"/>
  <text x="560" y="1066" text-anchor="middle" class="small">enter_history_taking</text>
  <path d="M 560 1035 L 560 994" class="dash"/>

  <path d="M 1040 1115 C 1115 1110 1185 1070 1240 994" class="dash"/>
  <rect x="1060" y="1035" width="360" height="48" fill="url(#blueHatch)" class="thinBox"/>
  <text x="1240" y="1066" text-anchor="middle" class="small">enter_risk_assessment</text>
  <path d="M 1240 1035 L 1240 994" class="dash"/>

  <path d="M 1040 1115 C 1210 1125 1410 1015 1430 694" class="dash"/>
  <rect x="1270" y="735" width="320" height="48" fill="url(#blueHatch)" class="thinBox"/>
  <text x="1430" y="766" text-anchor="middle" class="small">enter_analgesia</text>
  <path d="M 1430 735 L 1410 694" class="dash"/>

  <!-- Chains under agents -->
  <path d="M 460 694 L 460 740" class="line"/>
  <rect x="310" y="740" width="300" height="54" fill="url(#blueHatch)" class="thinBox"/>
  <text x="460" y="775" text-anchor="middle" class="label">information_chain</text>

  <path d="M 560 994 L 560 1110" class="line"/>
  <rect x="410" y="1110" width="300" height="54" fill="url(#blueHatch)" class="thinBox"/>
  <text x="560" y="1145" text-anchor="middle" class="label">history_chain</text>

  <path d="M 1240 994 L 1240 1110" class="line"/>
  <rect x="1090" y="1110" width="300" height="54" fill="url(#blueHatch)" class="thinBox"/>
  <text x="1240" y="1145" text-anchor="middle" class="label">risk_chain</text>

  <path d="M 1390 694 L 1390 810" class="line"/>
  <rect x="1235" y="810" width="310" height="54" fill="url(#blueHatch)" class="thinBox"/>
  <text x="1390" y="845" text-anchor="middle" class="label">analgesia_chain</text>

  <!-- Extract info side branch -->
  <rect x="400" y="1210" width="320" height="52" fill="url(#greenHatch)" class="thinBox"/>
  <text x="560" y="1243" text-anchor="middle" class="small">Extract_Info_Agent</text>
  <path d="M 560 1164 L 560 1210" class="dash"/>
  <path d="M 400 1236 C 290 1190 265 995 400 930" class="dash"/>
  <text x="250" y="1120" class="tiny">updates state</text>
  <path d="M 400 1236 C 300 1240 235 1110 235 680" class="dash"/>

  <!-- Background Graph QA side note -->
  <rect x="1505" y="900" width="240" height="120" fill="#fffdf4" class="note"/>
  <text x="1625" y="930" text-anchor="middle" class="small">Web side thread</text>
  <text x="1625" y="958" text-anchor="middle" class="tiny">when state=analgesia</text>
  <text x="1625" y="984" text-anchor="middle" class="tiny">run graph_qa_chain</text>
  <text x="1625" y="1010" text-anchor="middle" class="tiny">write graph_qa_result</text>
  <path d="M 1505 960 C 1430 960 1410 990 1400 930" class="dash"/>
  <path d="M 1505 1005 C 1440 1080 1340 1110 1240 1110" class="dash"/>

  <!-- route_agent / completion -->
  <polygon points="900,1185 1050,1260 900,1335 750,1260" fill="#ffffff" stroke="#222" stroke-width="3" transform="translate(0,-110)"/>
  <text x="900" y="1137" text-anchor="middle" class="label">route_agent</text>
  <text x="900" y="1164" text-anchor="middle" class="tiny">checks last_message.tool_calls</text>

  <path d="M 610 767 C 720 810 780 965 830 1080" class="thinLine"/>
  <path d="M 710 1137 C 765 1140 800 1135 830 1150" class="thinLine"/>
  <path d="M 1090 1137 C 1035 1140 1000 1135 970 1150" class="thinLine"/>
  <path d="M 1235 837 C 1110 900 1010 1010 970 1080" class="thinLine"/>

  <rect x="760" y="1188" width="280" height="52" fill="url(#blueHatch)" class="thinBox"/>
  <text x="900" y="1221" text-anchor="middle" class="small">END: wait next user input</text>
  <path d="M 900 1185 L 900 1188" class="line"/>

  <path d="M 1050 1150 C 1160 1150 1180 1075 1050 950" class="return"/>
  <rect x="1080" y="1188" width="260" height="52" fill="url(#blueHatch)" class="thinBox"/>
  <text x="1210" y="1221" text-anchor="middle" class="small">leave_skill(pop)</text>
  <path d="M 1048 1150 L 1080 1214" class="thinLine"/>
  <path d="M 1210 1188 C 1190 1080 1100 970 1050 945" class="return"/>
  <text x="1265" y="1095" class="tiny">CompleteOrEscalate</text>

  <!-- UI response -->
  <rect x="60" y="735" width="360" height="145" fill="#fbfbfb" class="thinBox"/>
  <text x="240" y="770" text-anchor="middle" class="label">User Interface</text>
  <text x="240" y="805" text-anchor="middle" class="tiny">send_message returns last_message</text>
  <text x="240" y="830" text-anchor="middle" class="tiny">chat.js renders response</text>
  <text x="240" y="855" text-anchor="middle" class="tiny">next input re-enters graph.stream</text>
  <path d="M 760 1214 C 500 1200 420 975 300 880" class="thinLine"/>

  <!-- Legend -->
  <rect x="1420" y="110" width="320" height="220" fill="#ffffff" class="thinBox"/>
  <text x="1580" y="148" text-anchor="middle" class="label">Legend</text>
  <rect x="1460" y="170" width="52" height="28" fill="url(#blueHatch)" class="thinBox"/>
  <text x="1530" y="191" class="tiny">graph/web control node</text>
  <rect x="1460" y="210" width="52" height="28" fill="url(#greenHatch)" class="thinBox"/>
  <text x="1530" y="231" class="tiny">agent node</text>
  <rect x="1460" y="250" width="52" height="28" fill="url(#redHatch)" class="thinBox"/>
  <text x="1530" y="271" class="tiny">risk agent node</text>
  <line x1="1460" y1="300" x2="1512" y2="300" class="dash"/>
  <text x="1530" y="306" class="tiny">side effect / state update</text>
</svg>
